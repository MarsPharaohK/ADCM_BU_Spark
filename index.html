<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2.5C16.6 10.5 21.5 15.4 29.5 16C21.5 16.6 16.6 21.5 16 29.5C15.4 21.5 10.5 16.6 2.5 16C10.5 15.4 15.4 10.5 16 2.5Z' fill='%23ffc8e1' stroke='%23000' stroke-width='2.4' stroke-linejoin='round'/></svg>">
<script src="config.js"></script>
</head>
<body>
<title>ADCM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Patrick+Hand&display=swap">
<style>
/* Layout: Paper Wireframe Kit language. Handwritten type, grayscale with crayon accents, 2px ink outlines, 8px controls / 12px containers, one idea per section. */
:root{
  --bg:#fafafa; --surface:#ffffff; --gray1:#ededed; --gray2:#d9d9d9; --gray3:#b3b3b3; --gray4:#919191; --gray5:#666666; --gray6:#444444;
  --ink:#1e1e1e; --muted:#666666; --soft:#d9d9d9; --sunk:#ededed; --edge:#1e1e1e; --on:#1e1e1e;
  --pink:#ffc8e1; --pink-ink:#d6337f;
  --sky:var(--pink); --lime:var(--pink); --lilac:var(--pink); --sun:var(--pink); --peach:var(--pink);
  --good:var(--ink); --warn:var(--pink-ink);
  --f-head:"Gochi Hand","Patrick Hand","Comic Sans MS",cursive;
  --f-body:"Patrick Hand","Gochi Hand","Comic Sans MS",cursive;
  --f-mono:"DM Mono",Menlo,Consolas,monospace;
  --r:12px; --rc:8px; --b:2px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141414; --surface:#1e1e1e; --gray1:#2a2a2a; --gray2:#3a3a3a; --gray3:#5a5a5a; --gray4:#7a7a7a; --gray5:#a8a8a8; --gray6:#cfcfcf;
  --ink:#f2f2f2; --muted:#a8a8a8; --soft:#3a3a3a; --sunk:#2a2a2a; --edge:#f2f2f2;
  --pink:#f2b3d0; --pink-ink:#ff7ab8;
  --sky:var(--pink); --lime:var(--pink); --lilac:var(--pink); --sun:var(--pink); --peach:var(--pink);
  --good:var(--ink); --warn:var(--pink-ink); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1e1e1e; --gray1:#2a2a2a; --gray2:#3a3a3a; --gray3:#5a5a5a; --gray4:#7a7a7a; --gray5:#a8a8a8; --gray6:#cfcfcf;
  --ink:#f2f2f2; --muted:#a8a8a8; --soft:#3a3a3a; --sunk:#2a2a2a; --edge:#f2f2f2;
  --pink:#f2b3d0; --pink-ink:#ff7ab8;
  --sky:var(--pink); --lime:var(--pink); --lilac:var(--pink); --sun:var(--pink); --peach:var(--pink);
  --good:var(--ink); --warn:var(--pink-ink); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:19px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-head);font-weight:400;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(44px,6.4vw,72px)}
h2{font-size:clamp(34px,4.4vw,50px)}
h3{font-size:30px}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--edge);outline-offset:3px}
a{color:inherit}
.p-aim,.p-try,.p-check,.p-build,.p-show,.p-teach{--c:var(--surface)}
.role.p-try{--c:var(--pink)}

/* Navigation (kit: top bar with soft shadow; tabs with underline) */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);box-shadow:0 2px 0 var(--gray2)}
.bar-in{display:flex;align-items:center;gap:16px;max-width:1200px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-head);font-size:28px;margin-right:auto;background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;gap:10px;line-height:1}
.logo small{font-family:var(--f-body);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:var(--b) solid var(--gray3);border-radius:6px;padding:1px 6px}
.ctx{font-size:17px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.snav{border-top:1px solid var(--gray2)}
.snav-in{max-width:1200px;margin:0 auto;display:flex;gap:2px;align-items:stretch;overflow-x:auto;scrollbar-width:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.snav-in::-webkit-scrollbar{display:none}
.np{flex:0 0 auto;border:0;background:none;padding:12px 12px 10px;font-size:17px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;color:var(--muted);border-bottom:3px solid transparent}
.np:hover{color:var(--ink)}
.np[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.np .ct{font-family:var(--f-mono);font-size:11px;min-width:18px;text-align:center;padding:1px 6px;border-radius:6px;border:1.5px solid var(--ink);color:var(--ink)}
.np .ok{color:var(--good);font-weight:700}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:17px;color:var(--muted)}
.crumbs [aria-current]{color:var(--ink)}

/* Buttons (kit: filled / outlined / text, 3 sizes) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:var(--b) solid var(--ink);background:var(--ink);color:var(--surface);padding:12px 22px;border-radius:var(--rc);cursor:pointer;font-family:var(--f-head);font-size:22px;line-height:1.1;transition:transform .1s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.btn.alt,.btn.plain{background:var(--surface);color:var(--ink)}
.btn.sm{padding:6px 14px;font-size:18px}
.link{background:none;border:0;padding:4px 2px;cursor:pointer;color:var(--ink);font-family:var(--f-head);font-size:20px}
.link:hover{text-decoration:underline;text-underline-offset:4px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}

/* Page column */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:56px 160px}
main.landing{padding-block:0}
.col{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
.col.wide{max-width:960px}
.head{display:flex;flex-direction:column;gap:18px}
.head .sub{font-size:22px;color:var(--muted);max-width:540px;line-height:1.4}
.tag{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:17px;padding:3px 12px;border-radius:6px;border:var(--b) solid var(--ink);background:var(--c,var(--surface));color:var(--on)}
.stk{background:var(--surface);border:var(--b) solid var(--ink);border-radius:var(--r)}

/* Form elements (kit: 2px ink border, 8px radius, LABEL / hint) */
form{display:flex;flex-direction:column;gap:40px}
.field{display:flex;flex-direction:column;gap:10px;min-width:0;border:0;padding:0;margin:0}
.field > .l,.field > legend{font-family:var(--f-head);font-size:26px;line-height:1.15;padding:0}
.field > legend{margin-bottom:10px}
.field > .h{font-size:17px;color:var(--muted);margin-top:-4px}
.opt{font-family:var(--f-body);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:10px;vertical-align:middle}
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;background:var(--surface);border:var(--b) solid var(--ink);border-radius:var(--rc);padding:11px 14px;font-size:19px}
input[type=text]:focus,input[type=email]:focus,input[type=password]:focus,textarea:focus,select:focus{outline:2px dashed var(--ink);outline-offset:2px}
textarea{min-height:120px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--gray4)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
@media (max-width:600px){.two{grid-template-columns:minmax(0,1fr)}}
.oneline{display:flex;align-items:center;gap:10px;background:var(--surface);border:var(--b) solid var(--ink);border-radius:var(--rc);padding-left:14px}
.oneline:focus-within{outline:2px dashed var(--ink);outline-offset:2px}
.oneline span{color:var(--muted);white-space:nowrap}
.oneline input{border:0 !important;padding-left:0 !important;background:none !important;min-width:0;outline:none !important}
@media (max-width:480px){.oneline{flex-wrap:wrap;padding-top:10px}.oneline input{flex-basis:100%}}
.otherbox{margin-top:2px;max-width:420px}
/* choice chips = kit Tag / Filter */
.chipset{display:flex;flex-wrap:wrap;gap:10px}
.chipset label{position:relative;cursor:pointer}
.chipset input{position:absolute;opacity:0;pointer-events:none}
.chipset span{display:inline-block;padding:7px 14px;border-radius:var(--rc);border:var(--b) solid var(--ink);background:var(--surface);font-size:18px}
.chipset label:hover span{background:var(--gray1)}
.chipset input:checked + span{background:var(--ink);color:var(--surface)}
.chipset input[type=checkbox]:checked + span::before{content:"✓ "}
.chipset input:focus-visible + span{outline:2px dashed var(--edge);outline-offset:2px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:16px;color:var(--muted)}
.sugg button{border:1.5px dashed var(--gray4);background:none;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:16px;color:var(--ink)}
.sugg button:hover{border:1.5px solid var(--ink)}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;border:var(--b) dashed var(--gray4);border-radius:var(--r);padding:34px 22px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface)}
.drop:hover{border-color:var(--ink);color:var(--ink)}
.drop .em{font-size:30px}
.drop input{font-size:15px;max-width:100%}
.actions{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.kwin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:560px){.kwin{grid-template-columns:minmax(0,1fr)}}
.kwin input{font-family:var(--f-head);font-size:30px;text-align:center;padding:14px 10px;color:var(--on)}
.kwin input:nth-child(1){background:var(--sky)} .kwin input:nth-child(2){background:var(--lime)} .kwin input:nth-child(3){background:var(--pink)}
.kwin input::placeholder{color:var(--on);opacity:.35}

/* Guidance (kit: gray panel header + annotation sticky) */
.todo{list-style:none;counter-reset:t;margin:0;padding:22px 24px;display:flex;flex-direction:column;gap:14px;background:var(--gray1);border-radius:var(--r)}
.todo li{counter-increment:t;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:baseline}
.todo li::before{content:counter(t);font-family:var(--f-head);font-size:18px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;align-self:start}
.why{font-size:18px;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
.why b{color:var(--ink);font-weight:400;font-family:var(--f-head);font-size:20px}
details.ex{border:var(--b) solid var(--ink);border-radius:var(--r);background:var(--surface)}
details.ex summary{cursor:pointer;padding:14px 18px;font-family:var(--f-head);font-size:20px}
details.ex > div{padding:0 18px 18px;display:flex;flex-direction:column;gap:8px;color:var(--muted)}
.finish{padding:24px 26px;display:flex;flex-direction:column;gap:8px;background:var(--sky);color:var(--on);border:var(--b) solid var(--ink);border-radius:var(--r)}
.finish .lab{color:var(--on);opacity:.7}
.finish .q{font-family:var(--f-head);font-size:34px;line-height:1.1}
.finish small{font-size:17px;opacity:.8}
.kwbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:17px;color:var(--muted)}
.kw{font-size:17px;padding:1px 10px;border-radius:6px;border:var(--b) solid var(--ink);color:var(--on)}
.kw:nth-of-type(1){background:var(--sky)} .kw:nth-of-type(2){background:var(--lime)} .kw:nth-of-type(3){background:var(--pink)}
.starters{display:flex;flex-direction:column;gap:14px}
.starter{display:flex;flex-direction:column;gap:10px;padding:20px 22px}
.starter .s-t{font-family:var(--f-head);font-size:22px}
.starter p{font-family:var(--f-mono);font-size:15px;line-height:1.6;word-break:break-word;color:var(--gray6)}
.editing{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--rc);border:var(--b) solid var(--ink);background:var(--surface)}
.editing::before{content:"ⓘ";font-size:20px}
.editing span{flex:1}

/* Map */
.stuck{display:flex;flex-direction:column;gap:16px}
.stuck h2{font-size:36px}
.stuck .chips{display:flex;flex-wrap:wrap;gap:10px}
.stuck .chips button{border:var(--b) solid var(--ink);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:18px}
.stuck .chips button:hover{background:var(--ink);color:var(--surface)}
.phaselist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:20px}
.phaselist > li{display:flex;flex-direction:column;border:var(--b) solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.phaselist .ph-h{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--gray1)}
.phaselist .pn{width:44px;height:44px;border-radius:50%;background:var(--c);border:var(--b) solid var(--ink);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.phaselist h3{font-size:30px}
.phaselist .pd{color:var(--muted);font-size:17px}
.phaselist .rows{display:flex;flex-direction:column;padding:4px 20px 8px}
.phaselist button.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border:0;border-bottom:1px solid var(--gray2);background:none;text-align:left;cursor:pointer}
.phaselist button.row:last-child{border-bottom:0}
.phaselist button.row:hover .t{text-decoration:underline;text-underline-offset:4px}
.phaselist .t{font-family:var(--f-head);font-size:22px}
.phaselist .d{color:var(--muted);font-size:16px;margin-left:8px}
.phaselist .n{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.done{color:var(--good) !important}

/* Records (kit: List & Table, Tag, Badge, Image) */
.cards{display:flex;flex-direction:column;gap:20px}
.card{padding:24px 26px;display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:16px;color:var(--muted)}
.lab{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:17px;padding:2px 10px;border-radius:6px;border:var(--b) solid var(--ink);background:var(--c,var(--surface));color:var(--on)}
.pill{font-size:15px;padding:1px 9px;border-radius:6px;border:var(--b) solid currentColor}
.ok{color:var(--good)} .wait{color:var(--warn)} .none{color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:12px}
.thumbs img{width:160px;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--rc);border:var(--b) solid var(--ink)}
.ph{aspect-ratio:4/3;border-radius:var(--rc);border:var(--b) solid var(--ink);background:linear-gradient(to top right,transparent calc(50% - 1px),var(--gray3) 50%,transparent calc(50% + 1px)),linear-gradient(to top left,transparent calc(50% - 1px),var(--gray3) 50%,transparent calc(50% + 1px)),var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:15px;color:var(--muted);text-align:center;padding:8px}
.kwrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;padding:14px 0;border-bottom:1px solid var(--gray2)}
.kwrow b{font-family:var(--f-head);font-weight:400;font-size:28px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pick label{position:relative;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:var(--r);border:var(--b) solid var(--gray3);background:var(--surface)}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.pick label:has(input:checked) b::after{content:" ✓"}
.pick label:has(input:focus-visible){outline:2px dashed var(--edge);outline-offset:3px}
.pick img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px}
.pick b{font-family:var(--f-head);font-weight:400;font-size:22px}
.pick small{font-size:15px;color:var(--muted);line-height:1.3}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.mini article{display:flex;flex-direction:column;gap:6px;font-size:16px;color:var(--muted);padding:10px;border:var(--b) solid var(--ink);border-radius:var(--r);background:var(--surface)}
.mini article.cur{box-shadow:0 0 0 2px var(--ink)}
.mini img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px}
.mini .id{font-family:var(--f-head);font-size:22px;color:var(--ink)}
.mini .link{font-size:18px;align-self:flex-start;padding:0}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.compare figure{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.compare img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--rc);border:var(--b) solid var(--ink)}
.compare figcaption{font-size:17px;color:var(--muted)}
.saved{display:flex;flex-direction:column;gap:16px}
.saved h2{font-size:30px;padding:12px 18px;background:var(--gray1);border-radius:var(--rc)}
/* instructor feedback = kit annotation sticky */
.fb{border-radius:4px;background:var(--sun);color:var(--on);padding:18px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:2px 3px 0 var(--gray3);transform:rotate(-.4deg)}
.fb .who{font-family:var(--f-head);font-size:20px}
.fb .lab{color:var(--on)}
.fb form{flex-direction:row;flex-wrap:wrap;gap:10px}
.fb form input{flex:1 1 220px}
.fb .btn{background:var(--ink);color:var(--surface)}
.note{color:var(--muted);font-size:18px}
.pager{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:22px;border-top:var(--b) solid var(--ink)}

/* Entry */
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
@media (max-width:640px){.roles{grid-template-columns:minmax(0,1fr)}}
.role{display:flex;flex-direction:column;gap:12px;text-align:left;padding:30px 28px;cursor:pointer;min-height:240px;background:var(--c);color:var(--on);border:var(--b) solid var(--ink);border-radius:var(--r)}
.role:hover{transform:translateY(-2px)}
.role .em{font-size:38px;line-height:1}
.role b{font-family:var(--f-head);font-weight:400;font-size:38px;line-height:1}
.role span{opacity:.8}
.role i{font-style:normal;margin-top:auto;font-family:var(--f-head);font-size:22px}
.protocol{padding:0;overflow:hidden;display:flex;flex-direction:column}
.protocol::before{content:"Data protocol";display:block;padding:14px 22px;background:var(--gray1);font-family:var(--f-head);font-size:24px}
.protocol dl{margin:0;padding:22px;display:flex;flex-direction:column;gap:18px}
.protocol dt{font-family:var(--f-head);font-size:22px}
.protocol dd{margin:2px 0 0;color:var(--muted)}
.agree{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;cursor:pointer}
.agree input{width:22px;height:22px;margin-top:3px;accent-color:var(--ink)}

/* Routes, timeline, lists */
.routes{display:flex;flex-direction:column;gap:14px}
.route{display:flex;align-items:center;gap:16px;text-align:left;padding:20px 22px;cursor:pointer;background:var(--c);color:var(--on);border:var(--b) solid var(--ink);border-radius:var(--r)}
.route:hover{transform:translateY(-2px)}
.route .em{font-size:30px}
.route b{display:block;font-family:var(--f-head);font-weight:400;font-size:28px;line-height:1.1}
.route i{font-style:normal;font-size:17px;opacity:.8}
.tl{display:flex;flex-direction:column;border:var(--b) solid var(--ink);border-radius:var(--r);background:var(--surface);overflow:hidden}
.tl button{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;padding:14px 18px;border:0;border-bottom:1px solid var(--gray2);background:none;cursor:pointer}
.tl button:last-child{border-bottom:0}
.tl button:hover{background:var(--gray1)}
.tl .em{font-size:20px}
.tl .x{font-family:var(--f-head);font-size:21px}
.tl .k{display:block;font-size:16px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stats span{font-size:17px;padding:3px 12px;border-radius:6px;border:var(--b) solid var(--ink);background:var(--surface)}
.stats b{font-family:var(--f-mono);font-weight:500;font-size:14px}
.steps{display:flex;flex-direction:column;border:var(--b) solid var(--ink);border-radius:var(--r);background:var(--surface);overflow:hidden}
.steprow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 20px;border:0;border-bottom:1px solid var(--gray2);background:none;text-align:left;cursor:pointer}
.steprow:last-child{border-bottom:0}
.steprow:hover{background:var(--gray1)}
.steprow .av{width:44px;height:44px;border-radius:50%;background:var(--c,var(--peach));border:var(--b) solid var(--ink);display:grid;place-items:center;font-family:var(--f-head);font-size:22px;color:var(--on)}
.steprow .t{font-family:var(--f-head);font-size:24px}
.steprow .d{display:block;color:var(--muted);font-size:16px}
.steprow .n{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

/* Landing */
.sec{max-width:1200px;margin:0 auto;padding-block:clamp(88px,13vw,150px);display:flex;flex-direction:column;gap:40px}
.sec + .sec{border-top:var(--b) dashed var(--gray3)}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(40px,7vw,96px);align-items:center}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.copy{display:flex;flex-direction:column;gap:22px;max-width:520px;min-width:0}
.copy p{font-size:22px;color:var(--muted);line-height:1.45}
.hero{min-height:min(860px,calc(100svh - 70px));justify-content:center}
.hero h1{position:relative}
.doodle{position:absolute;pointer-events:none;color:var(--ink)}
.spark{width:54px;top:-46px;right:6%}
.ring{position:absolute;inset:-14px -22px;width:calc(100% + 44px);height:calc(100% + 28px);overflow:visible}
.ringed{position:relative;display:inline-block}
.art{position:relative;aspect-ratio:1/1;max-width:520px;width:100%;justify-self:center}
.art .a1,.art .a2,.art .a3{position:absolute;border-radius:var(--r);background:var(--surface);border:var(--b) solid var(--ink);padding:22px;display:flex;flex-direction:column;gap:12px}
.art .a1{inset:4% 22% 34% 0;transform:rotate(-3deg)}
.art .a2{inset:30% 0 6% 18%;background:var(--lime);color:var(--on);transform:rotate(2deg)}
.art .a3{left:4%;bottom:2%;padding:8px 16px;background:var(--ink);color:var(--surface);border-radius:var(--rc);font-family:var(--f-head);font-size:24px;transform:rotate(-5deg)}
.art .ln{height:10px;border-radius:5px;background:var(--gray2)}
.art .a2 .ln{background:rgba(0,0,0,.14)}
.art small{font-size:15px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.art .big{font-family:var(--f-head);font-size:clamp(28px,3.4vw,40px);line-height:1.05}
.dims2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dims2 div{padding:24px 22px;border-radius:var(--r);background:var(--c);color:var(--on);border:var(--b) solid var(--ink);display:flex;flex-direction:column;gap:8px;min-height:170px}
.dims2 .e{font-size:30px}
.dims2 b{font-family:var(--f-head);font-weight:400;font-size:30px;line-height:1.05}
.dims2 small{font-size:14px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-top:auto}
.center{text-align:center;align-items:center}
.stepper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;width:100%}
@media (max-width:820px){.stepper{grid-template-columns:minmax(0,1fr)}}
.stp{display:flex;flex-direction:column;gap:16px;text-align:left;background:none;border:0;padding:0;cursor:pointer;opacity:.45;transition:opacity .2s}
.stp[aria-pressed="true"],.stp:hover{opacity:1}
@media (max-width:820px){.stp{opacity:1}}
.stp .top{display:flex;align-items:center;gap:12px}
.stp .no{width:46px;height:46px;border-radius:50%;border:var(--b) solid var(--ink);display:grid;place-items:center;font-family:var(--f-head);font-size:20px;flex:0 0 auto;background:var(--surface)}
.stp[aria-pressed="true"] .no{background:var(--ink);color:var(--surface)}
.stp[aria-pressed="true"] .pic{background:var(--pink)}
@media (max-width:820px){.stp .pic{background:var(--pink)}}
.stp .rule{height:2px;background:var(--ink);flex:1}
.stp .box{border:var(--b) solid var(--ink);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;background:var(--surface)}
.stp .pic{height:170px;background:var(--surface);display:grid;place-items:center;font-size:64px;border-bottom:var(--b) solid var(--ink);border-radius:0 0 50% 50% / 0 0 28% 28%}
.stp .txt{padding:20px 22px 26px;display:flex;flex-direction:column;gap:8px}
.stp b{font-family:var(--f-head);font-weight:400;font-size:32px;line-height:1.05}
.stp span.d{color:var(--muted);font-size:19px}
@media (prefers-reduced-motion:reduce){.stp{transition:none}}
.who2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(32px,6vw,80px)}
@media (max-width:720px){.who2{grid-template-columns:minmax(0,1fr)}}
.who2 > div{display:flex;flex-direction:column;gap:18px}
.who2 h3{font-size:clamp(34px,3.8vw,46px);line-height:1.05}
.who2 ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.who2 li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;color:var(--muted);font-size:20px}
.who2 li::before{content:"✓";width:22px;height:22px;border-radius:5px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:14px;margin-top:3px}
.cta{background-image:radial-gradient(var(--gray4) 1.4px,transparent 1.6px);background-size:44px 44px;border:var(--b) solid var(--ink);border-radius:var(--r);padding:clamp(56px,9vw,110px) clamp(24px,6vw,80px)}
.cta .copy{background:var(--bg);padding:8px 8px 8px 0}
.cta .btns{display:flex;flex-direction:column;gap:12px;max-width:300px}

/* Deck kit */
.deck{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 20px}
@media (max-width:640px){.deck{grid-template-columns:minmax(0,1fr)}}
.sl{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.sl-in{position:relative;aspect-ratio:16/9;max-width:100%;border:var(--b) solid var(--ink);border-radius:var(--rc);background:#fbfbf9;color:#1e1e1e;padding:6%;display:flex;gap:5%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.sl-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.sl-k{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#666}
.sl-in b{font-size:clamp(14px,1.9vw,19px);line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.sl-in ul{margin:4px 0 0;padding-left:14px;font-size:11px;line-height:1.4;color:#3a3a3a;overflow:hidden}
.sl-img{width:40%;display:flex;flex-direction:column;gap:6px}
.sl-img img{width:100%;flex:1;min-height:0;object-fit:contain;border-radius:4px}
.sl-n{position:absolute;right:10px;bottom:6px;font-size:10px;color:#999}
.phx{color:#d6337f !important}
.sl figcaption{font-size:16px;color:var(--muted)}
.outline{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;background:var(--gray1);padding:16px;border-radius:var(--rc);overflow-x:auto}

.credit{max-width:1200px;margin:0 auto;padding-block:36px 60px;border-top:var(--b) solid var(--ink);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:18px;color:var(--muted)}
.credit b{color:var(--ink);font-family:var(--f-head);font-weight:400;font-size:21px}
.ic{width:1.1em;height:1.1em;vertical-align:-.18em;flex:0 0 auto}
.pn .ic{width:24px;height:24px}
.stp .pic .ic{width:64px;height:64px}
.crumbs .ic,.np .ic,.tag .ic{width:18px;height:18px}
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:600px){.kinds{grid-template-columns:minmax(0,1fr)}}
.kind{position:relative;display:flex;flex-direction:column;gap:8px;padding:22px 22px 24px;border:var(--b) solid var(--ink);border-radius:var(--r);background:var(--surface);cursor:pointer}
.kind input{position:absolute;opacity:0;pointer-events:none}
.kind b{font-family:var(--f-head);font-weight:400;font-size:var(--t-sm,28px);line-height:1.1}
.kind span{font-family:var(--f-body);font-size:16px;line-height:1.5;color:var(--muted)}
.kind:hover{background:var(--gray1)}
.kind:has(input:checked){background:var(--pink);box-shadow:0 0 0 2px var(--ink)}
.kind:has(input:checked) span{color:var(--on)}
.kind:has(input:focus-visible){outline:2px dashed var(--edge);outline-offset:3px}
.when{display:flex;flex-direction:column;gap:var(--s4,44px)}
.when[hidden]{display:none}
.ph-btn{width:100%;border:0;text-align:left;cursor:pointer;display:grid !important;grid-template-columns:auto minmax(0,1fr) auto;align-items:center}
.ph-btn:hover .ph-n{text-decoration:underline;text-underline-offset:4px}
.ph-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.ph-n{font-family:var(--f-head);font-size:var(--t-md,35px);line-height:1.05}
.phaselist .n{font-family:var(--f-ui);font-size:20px;color:var(--ink)}
.inloop .pn{background:var(--pink)}
.loopnote{margin:0;padding:14px 26px 18px;font-family:var(--f-body);font-size:16px;line-height:1.5;color:var(--muted);border-top:1px dashed var(--gray3)}
details.optb > div{color:var(--ink);font-size:inherit;padding-top:8px;gap:var(--s3,40px)}
details.optb summary .opt{vertical-align:middle}
.savest{font-family:var(--f-ui);color:var(--muted)}
/* Toast (kit: black filled, info icon) */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:var(--rc);font-size:18px;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 4px 0 var(--gray3)}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ===== Type scale + rhythm from Wednesday homepage (Figma 49:151) =====
   Display XL 70/100% · Display 53/100% · Title 35/100% · Subtitle 28/120% · List 21 · UI 24 · Body Inter 18/150% · Caption 17
   Rhythm: title→body 24 · body→action 40 · within card 32 · between blocks 80+ */
:root{
  --f-head:"Patrick Hand","Comic Sans MS",cursive;
  --f-ui:"Patrick Hand","Comic Sans MS",cursive;
  --f-body:"Inter","Helvetica Neue",Arial,sans-serif;
  --t-xl:clamp(46px,5.4vw,70px); --t-lg:clamp(38px,4vw,53px); --t-md:35px; --t-sm:28px; --t-list:21px; --t-ui:24px; --t-body:18px; --t-cap:17px;
  --s1:12px; --s2:24px; --s3:40px; --s4:56px; --s5:80px; --s6:clamp(112px,14vw,176px);
  --measure:500px;
}
body{font-family:var(--f-body);font-size:var(--t-body);line-height:1.5}
h1{font-size:var(--t-xl);line-height:1}
h2{font-size:var(--t-lg);line-height:1}
h3{font-size:var(--t-md);line-height:1}
h1,h2,h3{font-family:var(--f-head)}
main{padding-block:96px 200px}
.col{max-width:700px;gap:var(--s5)}
.col.wide{max-width:980px}
.head{gap:var(--s2)}
.head .sub{font-family:var(--f-body);font-size:var(--t-body);line-height:1.5;max-width:var(--measure)}
.tag,.crumbs,.kwbar,.kw,.meta,.ctx,.note,.lab,.opt{font-family:var(--f-ui)}
.tag{font-size:var(--t-cap);padding:4px 14px}
.crumbs{font-size:var(--t-cap);gap:10px}
.kwbar,.kw{font-size:var(--t-cap)}
.note{font-size:var(--t-cap);line-height:1.4}
.lab{font-size:15px}
.meta{font-size:var(--t-cap)}
/* buttons & nav */
.btn{font-family:var(--f-ui);font-size:var(--t-ui);padding:12px 26px;line-height:1.2}
.btn.sm{font-size:20px;padding:6px 16px}
.link{font-family:var(--f-ui);font-size:22px}
.logo{font-family:var(--f-ui);font-size:30px}
.np{font-family:var(--f-ui);font-size:20px;padding:14px 14px 12px}
.bar-in{padding-block:18px}
/* forms */
form{gap:var(--s4)}
.field{gap:var(--s1)}
.field > .l,.field > legend{font-family:var(--f-head);font-size:var(--t-sm);line-height:1.2}
.field > legend{margin-bottom:var(--s1)}
.field > .h{font-family:var(--f-body);font-size:16px;line-height:1.5;margin-top:-2px}
input[type=text],input[type=email],input[type=password],textarea,select{font-family:var(--f-body);font-size:17px;padding:14px 16px}
.oneline span{font-family:var(--f-ui);font-size:20px}
.chipset{gap:12px}
.chipset span{font-family:var(--f-ui);font-size:var(--t-list);padding:8px 16px}
.sugg,.sugg button{font-family:var(--f-ui);font-size:var(--t-cap)}
.drop{font-family:var(--f-ui);font-size:20px;padding:48px 24px}
.actions{gap:var(--s2);margin-top:calc(var(--s3) - var(--s4) + 16px)}
.copy .actions{margin-top:16px}
.kwin{gap:16px}
.kwin input{font-family:var(--f-head);font-size:var(--t-md);padding:18px 10px}
/* guidance */
.todo{padding:28px 30px;gap:18px}
.todo li{font-family:var(--f-body);font-size:var(--t-body);line-height:1.5;grid-template-columns:44px minmax(0,1fr)}
.todo li::before{font-family:var(--f-ui);font-size:20px;width:32px;height:32px}
.why{font-family:var(--f-body);font-size:16px;line-height:1.5}
.why b{font-family:var(--f-ui);font-size:20px}
details.ex summary{font-family:var(--f-ui);font-size:22px;padding:18px 22px}
details.ex > div{font-family:var(--f-body);font-size:16px;line-height:1.6;padding:0 22px 22px;gap:10px}
.finish{padding:32px;gap:12px}
.finish .q{font-size:var(--t-md);line-height:1.05}
.finish small{font-family:var(--f-body);font-size:16px;line-height:1.5}
.starter{padding:28px 30px;gap:16px}
.starter .s-t{font-family:var(--f-ui);font-size:var(--t-sm)}
.editing{font-family:var(--f-ui);font-size:20px;padding:16px 20px}
/* map */
.stuck{gap:var(--s2)}
.stuck h2{font-size:var(--t-lg)}
.stuck .chips{gap:12px}
.stuck .chips button{font-family:var(--f-ui);font-size:var(--t-list);padding:8px 18px}
.phaselist{gap:28px}
.phaselist .ph-h{padding:20px 26px;gap:18px}
.phaselist .pn{width:52px;height:52px}
.phaselist h3{font-size:var(--t-md)}
.phaselist .pd{font-family:var(--f-body);font-size:16px;margin-top:4px}
.phaselist .rows{padding:8px 26px 14px}
.phaselist button.row{padding:16px 0}
.phaselist .t{font-family:var(--f-ui);font-size:var(--t-sm)}
.phaselist .d{font-family:var(--f-body);font-size:15px;margin-left:10px}
/* records */
.card{padding:32px;gap:var(--s2)}
.kwrow{padding:18px 0}
.kwrow b{font-family:var(--f-head);font-size:var(--t-sm)}
.pick{gap:16px}
.pick b{font-family:var(--f-ui);font-size:24px}
.pick small{font-family:var(--f-body);font-size:14px;line-height:1.4}
.mini{gap:18px}
.mini article{font-family:var(--f-body);font-size:15px;line-height:1.45;padding:12px;gap:8px}
.mini .id{font-family:var(--f-ui);font-size:24px}
.compare{gap:24px}
.compare figcaption{font-family:var(--f-ui);font-size:var(--t-cap)}
.saved{gap:var(--s2)}
.saved h2{font-size:var(--t-sm);padding:14px 22px}
.fb{padding:24px 26px;gap:12px;font-family:var(--f-body);font-size:17px;line-height:1.5}
.fb .who{font-family:var(--f-ui);font-size:22px}
.pager{padding-top:28px}
/* entry */
.roles{gap:28px}
.role{padding:40px 36px;gap:16px;min-height:280px}
.role b{font-size:var(--t-lg)}
.role span{font-family:var(--f-body);font-size:var(--t-body);line-height:1.5}
.role i{font-family:var(--f-ui);font-size:var(--t-ui)}
.protocol::before{font-family:var(--f-head);font-size:var(--t-sm);padding:18px 26px}
.protocol dl{padding:28px 26px;gap:24px}
.protocol dt{font-family:var(--f-head);font-size:var(--t-sm)}
.protocol dd{font-family:var(--f-body);font-size:var(--t-body);line-height:1.5;margin-top:6px}
.agree{font-family:var(--f-body);font-size:var(--t-body);line-height:1.5;padding:22px 24px}
.routes{gap:18px}
.route{padding:26px 28px;gap:20px}
.route b{font-size:var(--t-md);line-height:1}
.route i{font-family:var(--f-ui);font-size:20px}
.tl button{padding:18px 22px}
.tl .x{font-family:var(--f-ui);font-size:24px}
.tl .k{font-family:var(--f-body);font-size:15px}
.stats span{font-family:var(--f-ui);font-size:var(--t-cap);padding:4px 14px}
.steprow{padding:20px 24px}
.steprow .t{font-family:var(--f-ui);font-size:var(--t-sm)}
.steprow .d{font-family:var(--f-body);font-size:15px}
/* landing */
.sec{padding-block:var(--s6);gap:var(--s4)}
.split{gap:clamp(48px,8vw,120px)}
.copy{gap:var(--s2);max-width:560px}
.copy p{font-family:var(--f-body);font-size:var(--t-body);line-height:1.5;max-width:var(--measure)}
.hero{min-height:min(900px,calc(100svh - 72px))}
.dims2{gap:18px}
.dims2 div{padding:28px 26px;min-height:200px;gap:10px}
.dims2 b{font-size:var(--t-md)}
.dims2 small{font-family:var(--f-ui);font-size:15px}
.stepper{gap:28px}
.stp{gap:22px}
.stp .no{font-family:var(--f-ui);font-size:24px;width:52px;height:52px}
.stp .pic{height:200px}
.stp .txt{padding:28px 28px 32px;gap:14px}
.stp b{font-size:var(--t-md)}
.stp span.d{font-family:var(--f-body);font-size:var(--t-body);line-height:1.5}
.who2{gap:clamp(48px,8vw,120px)}
.who2 > div{gap:var(--s2)}
.who2 h3{font-size:var(--t-lg)}
.who2 ul{gap:16px}
.who2 li{font-family:var(--f-ui);font-size:var(--t-list)}
.cta{padding:clamp(64px,10vw,128px) clamp(28px,7vw,96px)}
.cta .btns{gap:16px}
.art small{font-family:var(--f-ui)}
.art .big{font-size:clamp(30px,3.4vw,44px)}
.credit{font-family:var(--f-body);font-size:16px;padding-block:48px 72px}
.credit b{font-family:var(--f-ui);font-size:22px}
/* deck */
.deck{gap:36px 24px}
.sl figcaption{font-family:var(--f-body);font-size:15px;line-height:1.5}
.toast{font-family:var(--f-ui);font-size:20px;padding:14px 22px}
@media (max-width:600px){
  :root{--t-md:30px;--t-sm:25px;--t-ui:22px}
  main{padding-block:64px 160px}
  .col{gap:var(--s4)}
  form{gap:44px}
  .card,.finish{padding:24px}
  .role{padding:30px 26px;min-height:220px}
}

/* Side gutters: one column of a 12-column grid on each side */
:root{--gut:max(20px,calc(100vw / 12))}
.bar-in,.snav-in,main,.credit{padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}

.credit{max-width:none;margin:0}

}catch(e){}}
function shrink(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=1400,sc=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);try{res(c.toDataURL('image/jpeg',0.82))}catch(e){res(fr.result)}};im.onerror=()=>res(fr.result);im.src=fr.result};fr.readAsDataURL(file)})}

async function makePptx(sl,u){await loadLib('https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js');
 const P=new window.PptxGenJS();P.layout='LAYOUT_WIDE';P.title=`${u.name} · ADCM deck`;
 for(const [i,x] of sl.entries()){const s=P.addSlide();s.background={color:'FBFBF9'};const w=x.imgs.length?6.6:12.1;
  s.addText(plain(x.kick).toUpperCase(),{x:0.6,y:0.45,w,h:0.4,fontSize:12,color:'62655F',bold:true,charSpacing:2,fontFace:'Arial'});
  s.addText(plain(x.title),{x:0.6,y:0.95,w,h:2.1,fontSize:i===0?44:32,bold:true,color:'141514',fontFace:'Arial',valign:'top',fit:'shrink'});
  if(x.body.length)s.addText(x.body.map(b=>({text:plain(b),options:{bullet:true,breakLine:true}})),{x:0.6,y:3.3,w,h:3.4,fontSize:18,color:'3A3D38',fontFace:'Arial',valign:'top',paraSpaceAfter:8});
  x.imgs.slice(0,2).forEach((im,j)=>{const n=Math.min(2,x.imgs.length),h=n===2?3.05:5.6;s.addImage({data:im.replace(/^data:/,''),x:7.5,y:n===2?0.6+j*3.25:0.95,w:5.2,h,sizing:{type:'contain',w:5.2,h}})});
  s.addText(String(i+1),{x:12.3,y:6.85,w:0.6,h:0.35,fontSize:10,color:'9A9C96',align:'right'});
  s.addNotes(plain(x.notes))}
 return await P.write({outputType:'blob'})}
async function makePdf(sl,u){await loadLib('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
 const {jsPDF}=window.jspdf,W=1280,H=720,doc=new jsPDF({orientation:'landscape',unit:'px',format:[W,H],hotfixes:['px_scaling']});
 sl.forEach((x,i)=>{if(i)doc.addPage([W,H],'landscape');doc.setFillColor(251,251,249);doc.rect(0,0,W,H,'F');const tw=x.imgs.length?620:1120;
  doc.setTextColor(98,101,95);doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text(plain(x.kick).toUpperCase(),64,72);
  doc.setTextColor(20,21,20);doc.setFontSize(i===0?54:40);const tl=doc.splitTextToSize(plain(x.title),tw);doc.text(tl.slice(0,4),64,130);
  let y=130+Math.min(tl.length,4)*(i===0?60:46)+40;doc.setFont('helvetica','normal');doc.setFontSize(22);doc.setTextColor(58,61,56);
  x.body.forEach(b=>{const ls=doc.splitTextToSize('•  '+plain(b),tw);if(y+ls.length*30<H-40){doc.text(ls,64,y);y+=ls.length*30+12}});
  x.imgs.slice(0,2).forEach((im,j)=>{const n=Math.min(2,x.imgs.length),bw=520,bh=n===2?290:500,by=n===2?60+j*310:110;try{const pr=doc.getImageProperties(im),sc=Math.min(bw/pr.width,bh/pr.height),iw=pr.width*sc,ih=pr.height*sc;doc.addImage(im,'JPEG',700+(bw-iw)/2,by+(bh-ih)/2,iw,ih)}catch(e){}});
  doc.setFontSize(12);doc.setTextColor(154,156,150);doc.text(String(i+1),W-64,H-36,{align:'right'})});
 return doc.output('blob')}
async function exportDeck(kind){const u=me(),sl=buildSlides(u.d,u),note=$('#dlnote');
 if(kind==='copy'){const txt=outlineText(sl);try{await navigator.clipboard.writeText(txt);toast('Outline copied 📋')}catch(e){const o=$('#outline');o.hidden=false;const r=document.createRange();r.selectNodeContents(o);const g=getSelection();g.removeAllRanges();g.addRange(r);toast('Selected. Copy it with your keyboard.')}return}
 const ns=await dlNS();
 toast('Building your deck…');
 try{const blob=kind==='pptx'?await makePptx(sl,u):await makePdf(sl,u);const base=(u.d.project||'adcm-deck').replace(/[^\w-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'adcm-deck';
  const fname=`${base}-deck.${kind}`;if(ns){await ns.save({filename:fname,data:blob})}else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}track('export',{kind});toast('Downloaded ✓')}
 catch(e){const c=e&&e.code;if(c==='declined')return;note.textContent=c==='rate_limited'?'A download prompt is already open. Finish that one first.':e&&e.message==='load'?'Could not load the deck builder. Check your connection and try again.':'That download did not work here. Use "Copy outline" instead.'}}

  return put('cmp','C',{ids,votes,base:bs,note:g('note')},d.ver.length===1&&!ED(d,'cmp')?`Saved 🆚 ${bs} is now V1, your "before"`:'Saved 🆚')}
 if(k==='iss'){const K=kws(d);if(!need(K.map((_,i)=>'fit'+i)))return;if(!fd.getAll('assumed').length){toast('Tap at least one thing the AI assumed 👆');return}if(!need(['guess']))return;const fit={};K.forEach((x,i)=>fit[x]=g('fit'+i));
  return put('iss','I',{on:g('on'),fit,assumed:fd.getAll('assumed'),assumedText:g('assumedText'),normal:g('normal'),guess:g('guess'),imgs:[...imgs]},'Saved 🔍')}
 if(k==='dec'){if(!need(['kind']))return;const kind=g('kind'),E=ED(d,'dec');
  if(kind==='rules'&&!need(['rule']))return;
  const obj={issue:g('issue'),kind,rule:kind==='rules'?g('rule'):'',newRule:kind==='rules'?g('newRule'):'',reason:g('reason'),basis:fd.getAll('basis')};
  if(kind==='design'){const EV=E&&E.ver?d.ver.find(v=>v.id===E.ver):null;
   if(!EV&&!imgs.length){toast('Add a screenshot of the new version 🖼️');return}
   if(EV){if(imgs.length)EV.imgs=[...imgs];EV.note=g('vnote')}
   else{const vid=nid(d,'ver','V'),did=E?E.id:nid(d,'dec','D');d.ver.push({n:++seq+1,t:stamp(d),id:vid,imgs:[...imgs],note:g('vnote'),dec:did});obj.ver=vid}}
  if(E){Object.assign(E,obj);edit=null;toast('Updated ✓');return go('s-step','change')}
  d.dec.push({...base(),id:nid(d,'dec','D'),ver:'',...obj});
  if(obj.ver){const v=d.ver.find(x=>x.id===obj.ver);v.n=++seq}
  track('save',{kind:'dec',change:kind});if(kind==='rules'){d.round++;toast(`Round ${d.round} 🔁 Try your new rule`);return go('s-step',['Who it is for','My finish line'].includes(obj.rule)?'goal':'gen')}
  toast('Saved ✏️ New version added');return go('s-step','change')}
 if(k==='ver'){const E=ED(d,'ver');if(E){if(imgs.length)E.imgs=[...imgs];if(fd.has('note'))E.note=g('note');edit=null;toast('Updated ✓')}return go('s-step','change')}
 if(k==='test'){if(!need(['who','nail']))return;return put('test','T',{on:g('on'),who:g('who'),nail:g('nail'),said:g('said'),stuck:g('stuck')},'Saved 🙋')}
 if(k==='reply'){const x=d.fb.find(y=>y.id===f.dataset.id);if(x)x.reply=g('reply');toast('Reply sent 💬');return render()}
 if(k==='submit'){if(!need(['hit']))return;d.hit=g('hit');d.reflection=g('reflection');d.submitted=true;track('submit');toast('Submitted 🎤');return render()}
 if(k==='fb'){const [sid,t,id]=f.dataset.arg.split('|'),s=DB.students.find(x=>x.id===sid);s.d.fb.push({id:'F'+(s.d.fb.length+1),type:t,target:id,text:g('text'),reply:''});toast('Feedback attached 💬');return render()}
});
restore();
render();
initCloud();
